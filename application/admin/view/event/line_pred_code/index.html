<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        {:build_heading(null,FALSE)}
        <ul class="nav nav-tabs" data-field="status">
            <li class="active"><a href="#t-all" data-value="" data-toggle="tab">{:__('All')}</a></li>
            {foreach name="statusList" item="vo"}
            <li><a href="#t-{$key}" data-value="{$key}" data-toggle="tab">{$vo}</a></li>
            {/foreach}
        </ul>
    </div>
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div class="toolbar">
                        <form class="form-horizontal form-ajax" role="form" data-toggle="validator" method="POST" action="">
                            {:__('開通可看預測數')}:
                            <input id="c-seepred_count" data-rule="required" class="form-control" name="row[seepred_count]" type="number" value="{$seepred_count}">
                            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
                        </form>
                    </div>
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh,add,del')}
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
